services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting SQL Server}"
    ports:
      - "1433:1433"
    volumes:
      - home-management-sql:/var/opt/mssql
    restart: unless-stopped

volumes:
  home-management-sql:
